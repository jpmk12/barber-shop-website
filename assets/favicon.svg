<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Barber pole">
  <defs>
    <!-- diagonal red / white / blue spiral stripes -->
    <pattern id="bp" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(62)">
      <rect width="16" height="16" fill="#f7f2ea"/>
      <rect width="16" height="4" y="0" fill="#c0392f"/>
      <rect width="16" height="4" y="8" fill="#21548a"/>
    </pattern>
    <clipPath id="tube"><rect x="11" y="8.5" width="10" height="15"/></clipPath>
    <!-- chrome sheen for caps -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.5" stop-color="#9fa3a8"/>
      <stop offset="1" stop-color="#e4e6e8"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.6" stop-color="#c2c6cb"/>
      <stop offset="1" stop-color="#7e848b"/>
    </radialGradient>
    <!-- soft cylinder shading over the stripes -->
    <linearGradient id="tubeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="32" height="32" rx="7" fill="#3a3228"/>

  <!-- top finial -->
  <circle cx="16" cy="4.3" r="2.4" fill="url(#ball)"/>
  <!-- bottom finial -->
  <circle cx="16" cy="27.7" r="2.4" fill="url(#ball)"/>

  <!-- striped glass tube -->
  <g clip-path="url(#tube)">
    <rect x="6" y="4" width="20" height="24" fill="url(#bp)"/>
    <rect x="11" y="8.5" width="10" height="15" fill="url(#tubeShade)"/>
  </g>

  <!-- chrome end caps -->
  <rect x="9.5" y="6.6" width="13" height="3.2" rx="1.6" fill="url(#chrome)" stroke="#6e7378" stroke-width="0.4"/>
  <rect x="9.5" y="22.2" width="13" height="3.2" rx="1.6" fill="url(#chrome)" stroke="#6e7378" stroke-width="0.4"/>
</svg>
